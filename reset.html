<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置密码 · 北京时间</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  </head>
  <body class="auth-page">
    <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
    <div class="auth-card effect-border">
      <div class="auth-side">
        <div>
          <div class="auth-brand"><img src="icons/logo.svg" alt="" /><div class="auth-title">北京时间</div></div>
          <div class="auth-desc">输入验证码，设置新密码</div>
        </div>
        <div class="auth-illus"></div>
      </div>
      <div class="auth-form">
        <h2>重置密码</h2>
        <div class="sub">请填写注册邮箱（或用户名）与验证码</div>
        <form id="rsForm" class="form" style="display:grid;gap:12px;margin-top:12px">
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="rsIdent" type="text" placeholder="用户名或邮箱" required />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="5" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="rsCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="验证码（6位）" required />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="rsPass" type="password" placeholder="新密码" required />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="rsConfirm" type="password" placeholder="确认密码" required />
          </label>
          <button type="submit" class="btn">重置</button>
          <div id="rsHint" class="hint"></div>
        </form>
      </div>
    </div>
    <script src="auth-effects.js" defer></script>
    <script>
      const USERS_KEY='auth_users_v1'; const RESET_KEY='auth_resets_v1';
      function loadUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY)||'[]'); }catch{ return []; } }
      function saveUsers(arr){ try{ localStorage.setItem(USERS_KEY, JSON.stringify(arr)); }catch{} }
      function loadResets(){ try{ return JSON.parse(localStorage.getItem(RESET_KEY)||'[]'); }catch{ return []; } }
      function saveResets(arr){ try{ localStorage.setItem(RESET_KEY, JSON.stringify(arr)); }catch{} }
      const form=document.getElementById('rsForm');
      form.addEventListener('submit', async (e)=>{
        e.preventDefault(); const ident=document.getElementById('rsIdent').value.trim(); const code=(document.getElementById('rsCode').value||'').trim(); const p=document.getElementById('rsPass').value; const c=document.getElementById('rsConfirm').value; const hint=document.getElementById('rsHint');
        const idWrap=document.getElementById('rsIdent').closest('.input'); const codeWrap=document.getElementById('rsCode').closest('.input'); const pWrap=document.getElementById('rsPass').closest('.input'); const cWrap=document.getElementById('rsConfirm').closest('.input');
        [idWrap,codeWrap,pWrap,cWrap].forEach(w=>w&&w.classList.remove('error')); hint.textContent=''; hint.classList.remove('warn');
        const users=loadUsers(); const u = users.find(x=>x.username.toLowerCase()===ident.toLowerCase() || (x.email||'').toLowerCase()===ident.toLowerCase());
        if(!u){ hint.textContent='未找到该用户'; idWrap && idWrap.classList.add('error'); hint.classList.add('warn'); return; }
        if(!/^[0-9]{6}$/.test(code)){ hint.textContent='验证码格式不正确'; codeWrap && codeWrap.classList.add('error'); hint.classList.add('warn'); return; }
        let list=loadResets(); const i=list.findIndex(x=>x.username===u.username && x.code===code);
        if(i<0){ hint.textContent='验证码无效'; codeWrap && codeWrap.classList.add('error'); hint.classList.add('warn'); return; }
        const item=list[i]; if(Date.now()>item.exp){ hint.textContent='验证码已过期'; codeWrap && codeWrap.classList.add('error'); hint.classList.add('warn'); return; }
        if(p!==c){ hint.textContent='两次密码不一致'; pWrap && pWrap.classList.add('error'); cWrap && cWrap.classList.add('error'); hint.classList.add('warn'); return; }
        // update password (reuse hash from auth.js pattern)
        function hexToBytes(hex){ const arr=[]; for(let i=0;i<hex.length;i+=2){ arr.push(parseInt(hex.slice(i,i+2),16)); } return new Uint8Array(arr); }
        function bufToHex(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
        function strToUtf8(s){ return new TextEncoder().encode(s); }
        async function hashPw(pw, saltHex){ const data = new Uint8Array([...hexToBytes(saltHex), ...strToUtf8(pw)]); const h = await crypto.subtle.digest('SHA-256', data); return bufToHex(h); }
        function randomHex(n=16){ const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
        const salt = randomHex(16); const hash = await hashPw(p, salt);
        const uu = users.find(x=>x.username===u.username); if(!uu){ hint.textContent='用户不存在'; return; }
        uu.salt=salt; uu.hash=hash; saveUsers(users);
        // clear token
        list.splice(i,1); saveResets(list);
        hint.textContent='重置成功，请前往登录';
        try{ if(typeof window.playLoginSuccess==='function'){ window.playLoginSuccess(); } }catch{}
        setTimeout(()=>{ location.href='login.html'; }, 900);
      });
    </script>
  </body>
  </html>
