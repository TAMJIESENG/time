<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="58" fill="url(#g)" filter="url(#s)"/>
  <circle cx="64" cy="64" r="54" fill="rgba(255,255,255,0.85)"/>
  <!-- ticks -->
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <g transform="translate(64 64)">
      <!-- 12 major ticks -->
      <g>
        <g transform="rotate(0)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(30)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(60)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(90)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(120)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(150)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(180)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(210)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(240)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(270)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(300)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
        <g transform="rotate(330)"><line x1="0" y1="-48" x2="0" y2="-40"/></g>
      </g>
    </g>
  </g>
  <!-- hands -->
  <g transform="translate(64 64)">
    <g>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-36" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="6" x2="0" y2="-44" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#0ea5e9"/>
  </g>
</svg>

