<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>注册 · 北京时间</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  </head>
  <body class="auth-page">
    <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
    <div class="auth-card effect-border">
      <div class="auth-side">
        <div>
          <div class="auth-brand"><img src="icons/logo.svg" alt="" /><div class="auth-title">北京时间</div></div>
          <div class="auth-desc">注册成为会员，解锁所有功能</div>
        </div>
        <div class="auth-illus"></div>
      </div>
      <div class="auth-form">
        <h2>创建账户</h2>
        <div class="sub">填写以下信息以完成注册</div>
        <form id="regForm" class="form" style="display:grid;gap:12px;margin-top:12px">
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="regUser" type="text" placeholder="用户名" required />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6h18v12H3z" stroke="currentColor" stroke-width="1.5"/><path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="regEmail" type="email" placeholder="邮箱（可选）" />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="regPass" type="password" placeholder="密码" required />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="regConfirm" type="password" placeholder="确认密码" required />
          </label>
          <div class="auth-row">
            <div class="auth-links"><a href="login.html">已有账户？去登录</a></div>
          </div>
          <button type="submit" class="btn">注册</button>
          <div id="regHint" class="hint"></div>
        </form>
      </div>
    </div>
    <script src="auth-effects.js" defer></script>
    <script src="auth.js" defer></script>
  </body>
  </html>
