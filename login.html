<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 北京时间</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  </head>
  <body class="auth-page">
    <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
    <div class="auth-card effect-border">
      <div class="auth-side">
        <div>
          <div class="auth-brand"><img src="icons/logo.svg" alt="" /><div class="auth-title">北京时间</div></div>
          <div class="auth-desc">精准 · 优雅 · 纯前端</div>
        </div>
        <div class="auth-illus"></div>
      </div>
      <div class="auth-form">
        <h2>欢迎回来</h2>
        <div class="sub">请登录以继续使用</div>
        <form id="loginForm" class="form" style="display:grid;gap:12px;margin-top:12px">
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="loginUser" type="text" placeholder="用户名" required />
          </label>
          <label class="input">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="loginPass" type="password" placeholder="密码" required />
            <button type="button" class="pw-toggle" aria-label="显示密码" title="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><path d="M4 20 20 4" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </label>
          <div id="passStrength" class="pass-strength" aria-live="polite" style="display:none"></div>
          <div class="auth-row">
            <div class="auth-links"><a href="register.html">注册新账户</a><a href="forgot.html">忘记密码？</a></div>
          </div>
          <button type="submit" class="btn">登录</button>
          <div id="loginHint" class="hint"></div>
        </form>
        <div class="divider">或使用</div>
        <div class="oauth-row">
          <button class="oauth-btn" onclick="oauth('github')">GitHub</button>
          <button class="oauth-btn" onclick="oauth('google')">Google</button>
          <button class="oauth-btn" onclick="oauth('wechat')">微信</button>
        </div>
      </div>
    </div>
    <script src="auth-effects.js" defer></script>
    <script src="auth.js" defer></script>
    <script>
      // OAuth placeholders (configure your backend base URL)
      const OAUTH_BASE = localStorage.getItem('oauth_base') || '';
      function oauth(provider){
        if(!OAUTH_BASE){ alert('未配置后端 OAuth 地址。请在 localStorage 设置 oauth_base 或联系管理员。'); return; }
        const next = encodeURIComponent(new URLSearchParams(location.search).get('next')||'index.html');
        location.href = `${OAUTH_BASE}/oauth/${provider}?next=${next}`;
      }
    </script>
  </body>
  </html>
